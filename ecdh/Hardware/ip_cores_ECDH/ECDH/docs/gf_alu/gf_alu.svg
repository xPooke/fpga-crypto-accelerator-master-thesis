<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#5f6368"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#b06000"/></marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8430ce"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="640" fill="#f7f7f5"/>
  <text x="480" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#202124">gf_alu — 4 operacije, jedan deljeni množač</text>
  <text x="480" y="51" text-anchor="middle" font-size="12.5" fill="#5f6368">add/sqr privatni (jeftini — mux bi pojeo uštedu) · mul deljen između direktnog puta i gf_inv-a (mul-klijent)</text>

  <!-- ============ struktura ============ -->
  <rect x="48" y="70" width="864" height="320" rx="10" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.4"/>
  <text x="64" y="92" font-size="13" font-weight="700" fill="#202124">Struktura</text>

  <rect x="70" y="120" width="170" height="52" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.4"/>
  <text x="155" y="142" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b06000">snapshot r_a, r_b, r_op</text>
  <text x="155" y="160" text-anchor="middle" font-size="9" fill="#5f6368">na i_start u S_IDLE</text>

  <rect x="300" y="108" width="130" height="42" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.2"/>
  <text x="365" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#681da8">u_add (privatan)</text>
  <text x="365" y="142" text-anchor="middle" font-size="9" fill="#5f6368">XOR, 1 nivo</text>

  <rect x="300" y="160" width="130" height="42" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.2"/>
  <text x="365" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#681da8">u_sqr (privatan)</text>
  <text x="365" y="194" text-anchor="middle" font-size="9" fill="#5f6368">razmicanje+redukcija</text>

  <rect x="300" y="240" width="130" height="52" rx="8" fill="#fff" stroke="#8430ce" stroke-width="1.6"/>
  <text x="365" y="262" text-anchor="middle" font-size="11.5" font-weight="700" fill="#681da8">u_inv : gf_inv</text>
  <text x="365" y="280" text-anchor="middle" font-size="9" fill="#5f6368">Itoh–Tsujii, MUL-KLIJENT</text>

  <!-- arbiter -->
  <rect x="520" y="180" width="180" height="70" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.6"/>
  <text x="610" y="203" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b06000">ARBITAR množača</text>
  <text x="610" y="221" text-anchor="middle" font-size="9.5" fill="#202124">S_INV → gf_inv vozi</text>
  <text x="610" y="237" text-anchor="middle" font-size="9.5" fill="#202124">inače → direktni MUL (r_a, r_b)</text>

  <rect x="760" y="180" width="130" height="70" rx="8" fill="#fff" stroke="#8430ce" stroke-width="1.8"/>
  <text x="825" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#681da8">u_mul : gf_mul</text>
  <text x="825" y="225" text-anchor="middle" font-size="9" fill="#5f6368">JEDAN, digit-serial G_D</text>
  <text x="825" y="240" text-anchor="middle" font-size="9" fill="#5f6368">(hiljade LUT → deli se)</text>

  <line x1="430" y1="266" x2="560" y2="248" stroke="#8430ce" stroke-width="1.5" marker-end="url(#ap)"/>
  <text x="490" y="272" font-size="9" fill="#681da8">o_mul_start/a/b</text>
  <line x1="700" y1="215" x2="758" y2="215" stroke="#8430ce" stroke-width="1.8" marker-end="url(#ap)"/>
  <text x="729" y="206" text-anchor="middle" font-size="9" fill="#681da8">start/a/b</text>
  <path d="M 825 252 L 825 320 L 372 320 L 372 294" fill="none" stroke="#5f6368" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="600" y="312" text-anchor="middle" font-size="9" fill="#5f6368">busy/done/res — GRANA SE (inv uzorkuje samo u svojim MUL stanjima, direktni put samo u S_MUL)</text>

  <text x="64" y="360" font-size="9.5" fill="#5f6368">Isti arbitar obrazac se ponavlja sprat više: ecdh_top muxira ALU između ec_scalar_mult i ec_mxy.</text>
  <text x="64" y="376" font-size="9.5" fill="#5f6368">gf_alu_pkg: alu_op_t + num_bits(n) — jedini izvor istine za deljene helpere (mul brojač, inv šetnja, r_pc u step/mxy).</text>

  <!-- ============ FSM ============ -->
  <rect x="48" y="404" width="864" height="196" rx="10" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.4"/>
  <text x="64" y="426" font-size="13" font-weight="700" fill="#202124">Mašina stanja (reset → S_IDLE)</text>

  <rect x="80" y="460" width="120" height="52" rx="26" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="140" y="490" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b06000">S_IDLE</text>

  <rect x="300" y="424" width="140" height="46" rx="23" fill="#fff" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="370" y="446" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b06000">S_COMB</text>
  <text x="370" y="461" text-anchor="middle" font-size="8.5" fill="#5f6368">add/sqr, 1 takt</text>

  <rect x="300" y="482" width="140" height="46" rx="23" fill="#fff" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="370" y="504" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b06000">S_MUL</text>
  <text x="370" y="519" text-anchor="middle" font-size="8.5" fill="#5f6368">čeka mul done</text>

  <rect x="300" y="540" width="140" height="46" rx="23" fill="#fff" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="370" y="562" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b06000">S_INV</text>
  <text x="370" y="577" text-anchor="middle" font-size="8.5" fill="#5f6368">arbitar → inv; čeka inv done</text>

  <rect x="620" y="482" width="130" height="52" rx="26" fill="#fff" stroke="#f9ab00" stroke-width="1.6"/>
  <text x="685" y="512" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b06000">S_DONE</text>

  <line x1="200" y1="474" x2="298" y2="450" stroke="#b06000" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="240" y="450" font-size="8.5" fill="#b06000">ADD|SQR</text>
  <line x1="200" y1="490" x2="298" y2="503" stroke="#b06000" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="240" y="512" font-size="8.5" fill="#b06000">MUL</text>
  <line x1="200" y1="506" x2="298" y2="560" stroke="#b06000" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="228" y="548" font-size="8.5" fill="#b06000">INV</text>
  <line x1="440" y1="447" x2="618" y2="496" stroke="#b06000" stroke-width="1.5" marker-end="url(#ao)"/>
  <line x1="440" y1="505" x2="618" y2="508" stroke="#b06000" stroke-width="1.5" marker-end="url(#ao)"/>
  <line x1="440" y1="563" x2="618" y2="522" stroke="#b06000" stroke-width="1.5" marker-end="url(#ao)"/>
  <path d="M 685 534 L 685 592 L 140 592 L 140 514" fill="none" stroke="#b06000" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="420" y="586" text-anchor="middle" font-size="9" fill="#b06000">done puls → S_IDLE</text>

  <text x="480" y="622" text-anchor="middle" font-size="9.5" fill="#9aa0a6">docs/gf_alu/gf_alu.svg · avgust 2026 · RTL: src/gf_alu.vhd + src/gf_alu_pkg.vhd</text>
</svg>
