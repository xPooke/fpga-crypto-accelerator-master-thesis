<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#5f6368"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#b06000"/></marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8430ce"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="620" fill="#f7f7f5"/>
  <text x="480" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#202124">Mikroprogram-klijent — zajednički šablon za ec_point_step i ec_mxy</text>
  <text x="480" y="51" text-anchor="middle" font-size="12.5" fill="#5f6368">tabela od 14 redova (op, a, b → dst) + pc; ALU izvršava red po red preko handshake-a · ista mašina, različite tabele</text>

  <!-- ============ struktura ============ -->
  <rect x="48" y="70" width="864" height="270" rx="10" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.4"/>
  <text x="64" y="92" font-size="13" font-weight="700" fill="#202124">Struktura</text>

  <rect x="70" y="110" width="180" height="60" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.4"/>
  <text x="160" y="134" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b06000">r_pc (1..c_NUM_OPS)</text>
  <text x="160" y="152" text-anchor="middle" font-size="9" fill="#5f6368">+1 TAČNO jednom po operaciji</text>
  <text x="160" y="164" text-anchor="middle" font-size="9" fill="#5f6368">(na alu_done puls)</text>

  <rect x="310" y="110" width="290" height="140" rx="8" fill="#fff" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="455" y="132" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b06000">p_ALU_OPS — tabela, kolone op/a/b</text>
  <g font-family="Consolas, monospace" font-size="9.5" fill="#202124">
    <text x="326" y="154">red | op  | a    | b    → ALU</text>
    <text x="326" y="170"> 1  | MUL | X2   | Z1</text>
    <text x="326" y="186"> 2  | MUL | X1   | Z2</text>
    <text x="326" y="202">…   | …   | …    | …</text>
    <text x="326" y="218">14  | ADD | T1   | T2</text>
  </g>
  <text x="455" y="240" text-anchor="middle" font-size="9" fill="#5f6368">kombinaciono: drži operande TEKUĆEG reda na magistrali</text>

  <rect x="660" y="110" width="230" height="140" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.5"/>
  <text x="775" y="132" text-anchor="middle" font-size="11.5" font-weight="700" fill="#681da8">deljeni gf_alu (spolja)</text>
  <text x="775" y="152" text-anchor="middle" font-size="9.5" fill="#202124">o_alu_start → · i_alu_busy/done ←</text>
  <text x="775" y="170" text-anchor="middle" font-size="9.5" fill="#202124">i_alu_res ← rezultat reda</text>
  <text x="775" y="196" text-anchor="middle" font-size="9" fill="#5f6368">step: 6 MUL + 5 SQR + 3 ADD</text>
  <text x="775" y="212" text-anchor="middle" font-size="9" fill="#5f6368">mxy: 3 INV + 5 MUL + 1 SQR + 5 ADD</text>
  <text x="775" y="228" text-anchor="middle" font-size="9" fill="#5f6368">(jedina razlika = sadržaj tabele!)</text>

  <line x1="250" y1="140" x2="308" y2="140" stroke="#b06000" stroke-width="1.6" marker-end="url(#ao)"/>
  <text x="279" y="131" text-anchor="middle" font-size="9" fill="#b06000">bira red</text>
  <line x1="600" y1="160" x2="658" y2="160" stroke="#8430ce" stroke-width="1.8" marker-end="url(#ap)"/>

  <rect x="310" y="272" width="290" height="52" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.4"/>
  <text x="455" y="294" text-anchor="middle" font-size="11" font-weight="700" fill="#b06000">upis po dst koloni (p_DATAPATH)</text>
  <text x="455" y="312" text-anchor="middle" font-size="9" fill="#5f6368">na alu_done: i_alu_res → registar tekućeg reda</text>
  <path d="M 775 250 L 775 298 L 602 298" fill="none" stroke="#8430ce" stroke-width="1.6" marker-end="url(#ap)"/>
  <text x="700" y="290" text-anchor="middle" font-size="9" fill="#681da8">i_alu_res na done</text>

  <!-- ============ FSM ============ -->
  <rect x="48" y="356" width="864" height="200" rx="10" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.4"/>
  <text x="64" y="378" font-size="13" font-weight="700" fill="#202124">Mašina stanja (identična u oba modula; reset → S_IDLE)</text>

  <rect x="80" y="420" width="130" height="56" rx="28" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="145" y="446" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b06000">S_IDLE</text>
  <text x="145" y="463" text-anchor="middle" font-size="8.5" fill="#5f6368">registri prate ulaze</text>

  <rect x="330" y="420" width="140" height="56" rx="28" fill="#fff" stroke="#f9ab00" stroke-width="1.6"/>
  <text x="400" y="446" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b06000">S_ISSUE</text>
  <text x="400" y="463" text-anchor="middle" font-size="8.5" fill="#5f6368">start strob (busy=0)</text>

  <rect x="590" y="420" width="140" height="56" rx="28" fill="#fff" stroke="#f9ab00" stroke-width="1.6"/>
  <text x="660" y="446" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b06000">S_WAIT</text>
  <text x="660" y="463" text-anchor="middle" font-size="8.5" fill="#5f6368">čeka done; upis + pc+1</text>

  <rect x="800" y="420" width="110" height="56" rx="28" fill="#e6f4ea" stroke="#188038" stroke-width="1.8"/>
  <text x="855" y="452" text-anchor="middle" font-size="12.5" font-weight="700" fill="#137333">S_DONE</text>

  <line x1="210" y1="440" x2="588" y2="404 " stroke="#b06000" stroke-width="0"/>
  <path d="M 210 436 C 320 396, 500 396, 588 436" fill="none" stroke="#b06000" stroke-width="1.6" marker-end="url(#ao)"/>
  <text x="400" y="402" text-anchor="middle" font-size="9" fill="#b06000" font-weight="600">i_start (pc⇐1; ALU je idle → pravo u S_WAIT)</text>
  <line x1="470" y1="448" x2="588" y2="448" stroke="#b06000" stroke-width="1.6" marker-end="url(#ao)"/>
  <text x="529" y="439" text-anchor="middle" font-size="9" fill="#b06000">alu_busy=1 (strob primljen)</text>
  <path d="M 590 466 C 540 500, 500 500, 470 466" fill="none" stroke="#b06000" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="530" y="502" text-anchor="middle" font-size="9" fill="#b06000">alu_busy=0 → sledeći red</text>
  <line x1="730" y1="448" x2="798" y2="448" stroke="#b06000" stroke-width="1.6" marker-end="url(#ao)"/>
  <text x="764" y="438" text-anchor="middle" font-size="8.5" fill="#b06000">done ∧ pc=14</text>
  <path d="M 855 476 L 855 530 L 145 530 L 145 478" fill="none" stroke="#b06000" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="500" y="524" text-anchor="middle" font-size="9" fill="#b06000">done puls</text>

  <text x="64" y="548" font-size="9.5" fill="#5f6368">Disciplina: pc napreduje na done (S_ISSUE traje 2 takta — napredovanje tamo bi preskakalo redove); strob uvek gejtovan na busy.</text>

  <text x="480" y="600" text-anchor="middle" font-size="9.5" fill="#9aa0a6">docs/ec_point_step/mikroprogram_klijent.svg · avgust 2026 · RTL: src/ec_point_step.vhd, src/ec_mxy.vhd</text>
</svg>
