<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 980" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>

  <style>
    .box  { stroke-width:2; rx:8; }
    .sqr  { fill:#e6f4ea; stroke:#34a853; }   /* gf_sqr (komb) */
    .mul  { fill:#fdece0; stroke:#e8710a; }   /* gf_mul (klijent) */
    .ctrl { fill:#e8f0fe; stroke:#4a76d4; }   /* kontrola */
    .term { fill:#eeeeee; stroke:#888; }      /* idle/done */
    .name { font-size:15px; font-weight:bold; fill:#111; }
    .act  { font-size:11px; fill:#333; }
    .edge { stroke:#444; stroke-width:1.6; fill:none; marker-end:url(#arr); }
    .lbl  { font-size:11px; fill:#1a1a1a; }
    .lblb { font-size:11px; fill:#1a1a1a; font-weight:bold; }
    .leg  { font-size:12px; fill:#222; }
  </style>

  <text x="20" y="26" font-size="19" font-weight="bold" fill="#111">gf_inv FSM — Itoh–Tsujii (binarni metod), n = m−1</text>

  <!-- ===================== STATES ===================== -->
  <!-- S_IDLE -->
  <rect class="box term" x="190" y="50"  width="220" height="58"/>
  <text class="name" x="300" y="72"  text-anchor="middle">S_IDLE</text>
  <text class="act"  x="300" y="90"  text-anchor="middle">čeka i_start; o_busy=0</text>
  <text class="act"  x="300" y="103" text-anchor="middle">na start: r_beta,r_a←i_a; t←1; bitidx←MSB</text>

  <!-- S_DBL_SQ -->
  <rect class="box sqr" x="190" y="170" width="220" height="58"/>
  <text class="name" x="300" y="192" text-anchor="middle">S_DBL_SQ  ·  udvoj (kvadrati)</text>
  <text class="act"  x="300" y="210" text-anchor="middle">r_beta←gf_sqr(r_beta), sqcnt−−</text>
  <text class="act"  x="300" y="223" text-anchor="middle">(t kvadrata, 1/takt)</text>

  <!-- S_DBL_MUL -->
  <rect class="box mul" x="190" y="290" width="220" height="58"/>
  <text class="name" x="300" y="312" text-anchor="middle">S_DBL_MUL  ·  udvoj (množenje)</text>
  <text class="act"  x="300" y="330" text-anchor="middle">o_mul_b=saved; start; čekaj done</text>
  <text class="act"  x="300" y="343" text-anchor="middle">r_beta←mul_res; t←2·t</text>

  <!-- S_P1_SQ -->
  <rect class="box sqr" x="540" y="290" width="220" height="58"/>
  <text class="name" x="650" y="312" text-anchor="middle">S_P1_SQ  ·  +1 (kvadrat)</text>
  <text class="act"  x="650" y="332" text-anchor="middle">r_beta←gf_sqr(r_beta)  (1 takt)</text>

  <!-- S_P1_MUL -->
  <rect class="box mul" x="540" y="400" width="220" height="58"/>
  <text class="name" x="650" y="422" text-anchor="middle">S_P1_MUL  ·  +1 (množenje)</text>
  <text class="act"  x="650" y="440" text-anchor="middle">o_mul_b=a; start; čekaj done</text>
  <text class="act"  x="650" y="453" text-anchor="middle">r_beta←mul_res; t←t+1</text>

  <!-- S_NEXT -->
  <rect class="box ctrl" x="190" y="470" width="220" height="58"/>
  <text class="name" x="300" y="492" text-anchor="middle">S_NEXT  ·  kontrola petlje</text>
  <text class="act"  x="300" y="510" text-anchor="middle">bitidx−−; saved←r_beta; sqcnt←t</text>
  <text class="act"  x="300" y="523" text-anchor="middle">(priprema sledeći udvoj)</text>

  <!-- S_FIN -->
  <rect class="box sqr" x="190" y="600" width="220" height="58"/>
  <text class="name" x="300" y="622" text-anchor="middle">S_FIN  ·  finale</text>
  <text class="act"  x="300" y="642" text-anchor="middle">r_beta←gf_sqr(r_beta) = a⁻¹</text>

  <!-- S_DONE -->
  <rect class="box term" x="190" y="700" width="220" height="58"/>
  <text class="name" x="300" y="722" text-anchor="middle">S_DONE</text>
  <text class="act"  x="300" y="742" text-anchor="middle">o_res←r_beta; puls o_done</text>

  <!-- ===================== EDGES ===================== -->
  <!-- IDLE -> DBL_SQ -->
  <path class="edge" d="M300,108 L300,170"/>
  <text class="lblb" x="310" y="140">i_start=1</text>
  <text class="lbl"  x="310" y="153">(c_MSBIDX&lt;0 → S_FIN)</text>

  <!-- DBL_SQ self-loop -->
  <path class="edge" d="M190,185 C140,185 140,213 188,213"/>
  <text class="lbl" x="70" y="203">sqcnt&gt;0</text>

  <!-- DBL_SQ -> DBL_MUL -->
  <path class="edge" d="M300,228 L300,290"/>
  <text class="lblb" x="310" y="262">sqcnt=0</text>

  <!-- DBL_MUL self-loop (wait done) -->
  <path class="edge" d="M190,305 C140,305 140,333 188,333"/>
  <text class="lbl" x="78" y="323">!done</text>

  <!-- DBL_MUL -> P1_SQ  (bit=1) -->
  <path class="edge" d="M410,312 L540,314"/>
  <text class="lblb" x="430" y="305">done &amp; n(bitidx)=1</text>

  <!-- DBL_MUL -> NEXT (bit=0) -->
  <path class="edge" d="M300,348 L300,470"/>
  <text class="lblb" x="310" y="408">done &amp;</text>
  <text class="lblb" x="310" y="421">n(bitidx)=0</text>

  <!-- P1_SQ -> P1_MUL -->
  <path class="edge" d="M650,348 L650,400"/>

  <!-- P1_MUL self-loop -->
  <path class="edge" d="M760,415 C810,415 810,443 762,443"/>
  <text class="lbl" x="772" y="433">!done</text>

  <!-- P1_MUL -> NEXT -->
  <path class="edge" d="M540,440 C440,470 420,485 410,499"/>
  <text class="lblb" x="455" y="478">done</text>

  <!-- NEXT -> DBL_SQ (loop back) -->
  <path class="edge" d="M190,490 C90,490 90,199 188,199"/>
  <text class="lblb" x="40" y="350">bitidx&gt;0</text>
  <text class="lbl"  x="30" y="363">(sledeći bit)</text>

  <!-- NEXT -> FIN -->
  <path class="edge" d="M300,528 L300,600"/>
  <text class="lblb" x="310" y="568">bitidx=0</text>

  <!-- FIN -> DONE -->
  <path class="edge" d="M300,658 L300,700"/>

  <!-- DONE -> IDLE -->
  <path class="edge" d="M410,729 C520,729 520,79 412,79"/>
  <text class="lbl" x="525" y="400">!start → S_IDLE</text>
  <text class="lbl" x="525" y="414">start → S_DBL_SQ (b2b)</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="40" y="820" width="740" height="120" fill="#fafafa" stroke="#ccc"/>
  <text x="55" y="845" font-size="13" font-weight="bold" fill="#111">Legenda</text>
  <rect class="box sqr"  x="55"  y="858" width="22" height="16"/>
  <text class="leg" x="85"  y="871">gf_sqr — kombinacioni, privatna instanca (1 takt/kvadrat)</text>
  <rect class="box mul"  x="55"  y="884" width="22" height="16"/>
  <text class="leg" x="85"  y="897">gf_mul — DELJEN, mul-klijent (start/done handshake, ~m taktova)</text>
  <rect class="box ctrl" x="55"  y="910" width="22" height="16"/>
  <text class="leg" x="85"  y="923">kontrola petlje (bez aritmetike)</text>
  <text class="leg" x="440" y="871">Σ gf_sqr = m−1 (+1 finale) = 570 za B-571</text>
  <text class="leg" x="440" y="897">Σ gf_mul = 13 za B-571 (9 udvoj + 4 „+1")</text>
  <text class="leg" x="440" y="923">petlja se vrti num_bits(n)−1 = 9 puta (po bitu n)</text>
</svg>
