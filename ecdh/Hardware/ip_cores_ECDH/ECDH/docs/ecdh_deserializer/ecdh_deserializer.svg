<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#5f6368"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#b06000"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#188038"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#c5221f"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="900" fill="#f7f7f5"/>
  <text x="480" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#202124">ecdh_deserializer — posao, rubni slučajevi, mašina stanja</text>
  <text x="480" y="51" text-anchor="middle" font-size="12.5" fill="#5f6368">paket = cmd ‖ Qx ‖ Qy = 2N+1 reči (N = ⌈G_M/DW⌉, LSB-reč-prva) · primer dole: N = 1 → 3 reči</text>

  <!-- ============ posao ============ -->
  <rect x="48" y="70" width="864" height="96" rx="10" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.4"/>
  <text x="64" y="92" font-size="13" font-weight="700" fill="#202124">Posao (jedna rečenica po koraku)</text>
  <text x="72" y="114" font-size="11" fill="#202124">1. Prihvati reč kad je tvalid ∧ tready (tready = i_ready od omotača — dok jezgro računa, paket ČEKA na magistrali, ne gubi se).</text>
  <text x="72" y="132" font-size="11" fill="#202124">2. Upiši reč po rednom broju r_beat:  beat 0 → r_cmd,  1..N → r_qx,  N+1..2N → r_qy  (i reč koja nosi TLAST se upisuje!).</text>
  <text x="72" y="150" font-size="11" fill="#202124">3. TLAST tačno na beat-u 2N → o_valid (1 takt) → omotač preuzima cmd/Qx/Qy. Svaka druga dužina → paket se tiho odbacuje.</text>

  <!-- ============ scenariji ============ -->
  <rect x="48" y="186" width="864" height="300" rx="10" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.4"/>
  <text x="64" y="208" font-size="13" font-weight="700" fill="#202124">Tri scenarija (primer N=1: očekuju se 3 reči, TLAST na trećoj)</text>

  <!-- scenario A -->
  <text x="72" y="236" font-size="11.5" font-weight="700" fill="#188038">A) Tačna dužina → o_valid ✓</text>
  <g font-size="10.5">
    <rect x="90"  y="246" width="110" height="30" rx="4" fill="#fce8e6" stroke="#c5221f"/><text x="145" y="265" text-anchor="middle">cmd  (beat 0)</text>
    <rect x="204" y="246" width="110" height="30" rx="4" fill="#fff" stroke="#5f6368"/><text x="259" y="265" text-anchor="middle">Qx  (beat 1)</text>
    <rect x="318" y="246" width="150" height="30" rx="4" fill="#e6f4ea" stroke="#188038"/><text x="393" y="265" text-anchor="middle">Qy + TLAST (beat 2)</text>
  </g>
  <line x1="472" y1="261" x2="530" y2="261" stroke="#188038" stroke-width="2" marker-end="url(#ag)"/>
  <text x="540" y="257" font-size="10.5" fill="#188038" font-weight="700">TLAST ∧ beat = 2N  →  S_PRESENT: o_valid puls,</text>
  <text x="540" y="272" font-size="10.5" fill="#188038">pa S_WAIT dok omotač ne završi (i_ready)</text>

  <!-- scenario B -->
  <text x="72" y="312" font-size="11.5" font-weight="700" fill="#b06000">B) Prekratak (TLAST prerano) → tiho odbaci, bez gutanja</text>
  <g font-size="10.5">
    <rect x="90"  y="322" width="110" height="30" rx="4" fill="#fce8e6" stroke="#c5221f"/><text x="145" y="341" text-anchor="middle">cmd  (beat 0)</text>
    <rect x="204" y="322" width="150" height="30" rx="4" fill="#fef7e0" stroke="#b06000"/><text x="279" y="341" text-anchor="middle">Qx + TLAST (beat 1)</text>
  </g>
  <line x1="358" y1="337" x2="416" y2="337" stroke="#b06000" stroke-width="2" marker-end="url(#ao)"/>
  <text x="426" y="333" font-size="10.5" fill="#b06000" font-weight="600">TLAST ∧ beat &lt; 2N  →  NEMA o_valid; r_beat = 0, ostaje S_COLLECT.</text>
  <text x="426" y="348" font-size="10.5" fill="#5f6368">TLAST je SAM granica paketa — nema šta da se guta; polupakovane reči</text>
  <text x="426" y="362" font-size="10.5" fill="#5f6368">niko ne vidi (izlazi važe samo od o_valid) i pregaziće ih sledeći paket.</text>

  <!-- scenario C -->
  <text x="72" y="398" font-size="11.5" font-weight="700" fill="#c5221f">C) Predugačak (nema TLAST gde treba) → S_DROP guta do TLAST</text>
  <g font-size="10.5">
    <rect x="90"  y="408" width="90" height="30" rx="4" fill="#fce8e6" stroke="#c5221f"/><text x="135" y="427" text-anchor="middle">cmd (0)</text>
    <rect x="184" y="408" width="90" height="30" rx="4" fill="#fff" stroke="#5f6368"/><text x="229" y="427" text-anchor="middle">Qx (1)</text>
    <rect x="278" y="408" width="90" height="30" rx="4" fill="#fff" stroke="#5f6368"/><text x="323" y="427" text-anchor="middle">Qy (2)</text>
    <rect x="372" y="408" width="90" height="30" rx="4" fill="#fce8e6" stroke="#c5221f" stroke-dasharray="4 3"/><text x="417" y="427" text-anchor="middle" fill="#c5221f">višak…</text>
    <rect x="466" y="408" width="120" height="30" rx="4" fill="#fce8e6" stroke="#c5221f" stroke-dasharray="4 3"/><text x="526" y="427" text-anchor="middle" fill="#c5221f">višak + TLAST</text>
  </g>
  <line x1="590" y1="423" x2="648" y2="423" stroke="#c5221f" stroke-width="2" marker-end="url(#ar)"/>
  <text x="656" y="415" font-size="10.5" fill="#c5221f" font-weight="600">reč posle beat-a 2N bez TLAST →</text>
  <text x="656" y="429" font-size="10.5" fill="#c5221f" font-weight="600">S_DROP: tready=1, prima i BACA</text>
  <text x="656" y="443" font-size="10.5" fill="#c5221f" font-weight="600">do TLAST → nazad u S_COLLECT</text>
  <text x="90" y="462" font-size="10.5" fill="#5f6368">Zašto gutanje: AXIS nema „prekini" — granica je tek ispred. Povratak u S_COLLECT bez gutanja → rep paketa bi ušao kao</text>
  <text x="90" y="476" font-size="10.5" fill="#5f6368">cmd SLEDEĆEG paketa → trajna desinhronizacija framinga. Drop = resinhronizacija na granicu paketa, ne kazna.</text>

  <!-- ============ FSM ============ -->
  <rect x="48" y="506" width="864" height="330" rx="10" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.4"/>
  <text x="64" y="528" font-size="13" font-weight="700" fill="#202124">Mašina stanja (reset → S_COLLECT; „accept" = tvalid ∧ tready)</text>

  <!-- S_COLLECT -->
  <rect x="110" y="590" width="180" height="60" rx="30" fill="#fef7e0" stroke="#f9ab00" stroke-width="2.2"/>
  <text x="200" y="617" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b06000">S_COLLECT</text>
  <text x="200" y="634" text-anchor="middle" font-size="9" fill="#5f6368">prima i pakuje reči</text>

  <!-- S_PRESENT -->
  <rect x="450" y="590" width="170" height="60" rx="30" fill="#e6f4ea" stroke="#188038" stroke-width="1.8"/>
  <text x="535" y="617" text-anchor="middle" font-size="13.5" font-weight="700" fill="#137333">S_PRESENT</text>
  <text x="535" y="634" text-anchor="middle" font-size="9" fill="#5f6368">o_valid = 1 (jedan takt)</text>

  <!-- S_WAIT -->
  <rect x="720" y="590" width="160" height="60" rx="30" fill="#fff" stroke="#f9ab00" stroke-width="1.8"/>
  <text x="800" y="617" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b06000">S_WAIT</text>
  <text x="800" y="634" text-anchor="middle" font-size="9" fill="#5f6368">omotač radi, tready=0</text>

  <!-- S_DROP -->
  <rect x="450" y="740" width="170" height="60" rx="30" fill="#fce8e6" stroke="#c5221f" stroke-width="1.8"/>
  <text x="535" y="767" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c5221f">S_DROP</text>
  <text x="535" y="784" text-anchor="middle" font-size="9" fill="#5f6368">prima i baca (tready=1)</text>

  <!-- reset -->
  <line x1="60" y1="620" x2="108" y2="620" stroke="#5f6368" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="82" y="610" text-anchor="middle" font-size="9" fill="#5f6368">reset</text>

  <!-- COLLECT self: normal word -->
  <path d="M 160 588 C 140 546, 260 546, 240 588" fill="none" stroke="#5f6368" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="200" y="552" text-anchor="middle" font-size="9.5" fill="#5f6368">accept ∧ ¬TLAST: upiši reč, beat+1</text>

  <!-- COLLECT self: short packet (below) -->
  <path d="M 160 652 C 140 694, 260 694, 240 652" fill="none" stroke="#b06000" stroke-width="1.4" marker-end="url(#ao)"/>
  <text x="200" y="688" text-anchor="middle" font-size="9.5" fill="#b06000" font-weight="600">B: accept ∧ TLAST ∧ beat&lt;2N</text>
  <text x="200" y="702" text-anchor="middle" font-size="9" fill="#b06000">prekratak → odbaci (beat=0), bez o_valid</text>

  <!-- COLLECT -> PRESENT -->
  <line x1="290" y1="612" x2="448" y2="612" stroke="#188038" stroke-width="2" marker-end="url(#ag)"/>
  <text x="369" y="602" text-anchor="middle" font-size="9.5" fill="#188038" font-weight="700">A: accept ∧ TLAST ∧ beat=2N</text>

  <!-- PRESENT -> WAIT -->
  <line x1="620" y1="612" x2="718" y2="612" stroke="#b06000" stroke-width="1.8" marker-end="url(#ao)"/>
  <text x="669" y="602" text-anchor="middle" font-size="9.5" fill="#b06000" font-weight="600">uvek</text>

  <!-- WAIT -> COLLECT -->
  <path d="M 800 588 L 800 556 L 310 556 L 240 588" fill="none" stroke="#b06000" stroke-width="1.6" marker-end="url(#ao)"/>
  <text x="560" y="548" text-anchor="middle" font-size="9.5" fill="#b06000" font-weight="600">i_ready = 1 (omotač spreman za novi paket)</text>

  <!-- COLLECT -> DROP -->
  <path d="M 240 652 L 448 758" fill="none" stroke="#c5221f" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="300" y="736" text-anchor="middle" font-size="9.5" fill="#c5221f" font-weight="700">C: accept ∧ ¬TLAST ∧ beat=2N</text>
  <text x="300" y="750" text-anchor="middle" font-size="9" fill="#c5221f">(predugačak)</text>

  <!-- DROP self -->
  <path d="M 620 758 C 662 738, 662 802, 620 782" fill="none" stroke="#c5221f" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="700" y="774" font-size="9.5" fill="#c5221f">accept ∧ ¬TLAST: baci reč</text>

  <!-- DROP -> COLLECT -->
  <path d="M 450 790 L 120 790 L 120 652" fill="none" stroke="#c5221f" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="330" y="812" text-anchor="middle" font-size="9.5" fill="#c5221f" font-weight="600">accept ∧ TLAST (granica nađena) → nazad u S_COLLECT</text>

  <text x="480" y="866" text-anchor="middle" font-size="9.5" fill="#9aa0a6">documentation/ecdh_deserializer.svg · avgust 2026 · RTL: src/ecdh_deserializer.vhd · TLAST reč se UVEK pakuje (bug 12.8)</text>
</svg>
