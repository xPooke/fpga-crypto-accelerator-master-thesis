<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#5f6368"/></marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#a142f4"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="720" fill="#f7f7f5"/>
  <text x="480" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#202124">ecdh_top — nivo 3: jezgro (k·P → afino)</text>
  <text x="480" y="51" text-anchor="middle" font-size="12.5" fill="#5f6368">jedan gf_alu · dva ALU-klijenta · Top FSM bira ko drži ALU · ALU magistrala prikazana kao tip veze (A)</text>

  <!-- ============ spoljna kutija ============ -->
  <rect x="40" y="75" width="880" height="560" rx="10" fill="#fff" stroke="#5f6368" stroke-width="2"/>
  <text x="60" y="99" font-size="14" font-weight="700" fill="#202124">ecdh_top</text>
  <text x="900" y="99" text-anchor="end" font-size="10" fill="#5f6368">generici: G_M, G_D, G_F · preduslovi: k ≥ 1, xb ≠ 0, k ≠ red−1</text>

  <!-- ulazni portovi -->
  <line x1="4" y1="180" x2="38" y2="180" stroke="#5f6368" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="8" y="171" font-size="9.5" fill="#5f6368">i_start</text>
  <line x1="4" y1="230" x2="38" y2="230" stroke="#5f6368" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="8" y="221" font-size="9.5" fill="#5f6368">i_k, i_b</text>
  <line x1="4" y1="280" x2="38" y2="280" stroke="#5f6368" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="8" y="271" font-size="9.5" fill="#5f6368">i_xb, i_yb</text>
  <text x="60" y="122" font-size="9.5" fill="#5f6368">(snapshot ulaza u S_IDLE → r_k, r_xb, r_yb, r_b)</text>

  <!-- ============ Top FSM ============ -->
  <rect x="470" y="130" width="420" height="96" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.4"/>
  <text x="680" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b06000">Top FSM</text>
  <g font-size="10" fill="#202124">
    <rect x="486" y="166" width="74" height="30" rx="6" fill="#fff" stroke="#f9ab00"/><text x="523" y="185" text-anchor="middle">S_IDLE</text>
    <rect x="586" y="166" width="94" height="30" rx="6" fill="#fff" stroke="#f9ab00"/><text x="633" y="185" text-anchor="middle">S_LADDER</text>
    <rect x="706" y="166" width="74" height="30" rx="6" fill="#fff" stroke="#f9ab00"/><text x="743" y="185" text-anchor="middle">S_MXY</text>
    <rect x="806" y="166" width="70" height="30" rx="6" fill="#fff" stroke="#f9ab00"/><text x="841" y="185" text-anchor="middle">S_DONE</text>
  </g>
  <g stroke="#b06000" stroke-width="1.1">
    <line x1="560" y1="181" x2="585" y2="181" marker-end="url(#a)"/>
    <line x1="680" y1="181" x2="705" y2="181" marker-end="url(#a)"/>
    <line x1="780" y1="181" x2="805" y2="181" marker-end="url(#a)"/>
  </g>
  <text x="680" y="214" text-anchor="middle" font-size="9" fill="#5f6368">start strobovi ka smul/mxy: 1 takt, gejtovani na busy (bug-#5 disciplina) · prelaz na done puls deteta</text>

  <!-- ============ ec_scalar_mult ============ -->
  <rect x="80" y="150" width="320" height="222" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.6"/>
  <text x="240" y="174" text-anchor="middle" font-size="13.5" font-weight="700" fill="#174ea6">ec_scalar_mult</text>
  <text x="240" y="191" text-anchor="middle" font-size="10" fill="#5f6368">Montgomery lestvica (Lekcija 5) — ALU-klijent</text>
  <rect x="100" y="204" width="130" height="36" rx="6" fill="#fff" stroke="#1a73e8"/>
  <text x="165" y="222" text-anchor="middle" font-size="10.5" font-weight="600" fill="#174ea6">ec_cswap</text>
  <text x="165" y="234" text-anchor="middle" font-size="8.5" fill="#5f6368">komb., bez ALU</text>
  <rect x="100" y="252" width="170" height="36" rx="6" fill="#fff" stroke="#1a73e8"/>
  <text x="185" y="270" text-anchor="middle" font-size="10.5" font-weight="600" fill="#174ea6">ec_point_step</text>
  <text x="185" y="282" text-anchor="middle" font-size="8.5" fill="#5f6368">14 op po bitu (madd+mdouble)</text>
  <text x="240" y="312" text-anchor="middle" font-size="9" fill="#5f6368">S_ALIGN → S_INIT_2P → { S_SWAP → S_POINT_STEP</text>
  <text x="240" y="326" text-anchor="middle" font-size="9" fill="#5f6368">→ S_RESWAP → S_NEXT_BIT } · ~570 bita</text>
  <text x="240" y="352" text-anchor="middle" font-size="9.5" fill="#174ea6" font-weight="600">(A) magistrala ec_point_step-a izlazi kroz port modula</text>

  <!-- X1..Z2 arrow -->
  <line x1="240" y1="372" x2="240" y2="428" stroke="#5f6368" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="252" y="404" font-size="10" fill="#5f6368">X1, Z1, X2, Z2 (projektivno)</text>

  <!-- ============ ec_mxy ============ -->
  <rect x="80" y="430" width="320" height="130" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.6"/>
  <text x="240" y="454" text-anchor="middle" font-size="13.5" font-weight="700" fill="#174ea6">ec_mxy</text>
  <text x="240" y="472" text-anchor="middle" font-size="10" fill="#5f6368">y-recovery + afina konverzija — ALU-klijent</text>
  <text x="240" y="490" text-anchor="middle" font-size="9.5" fill="#5f6368">14 op: 3×INV + 5×MUL + 1×SQR + 5×ADD</text>
  <text x="240" y="506" text-anchor="middle" font-size="9.5" fill="#174ea6" font-weight="600">jedini korisnik ALU_INV u celom dizajnu</text>
  <text x="240" y="536" text-anchor="middle" font-size="9" fill="#5f6368">izvršava se UVEK (izlaz uvek afin; KEYGEN/SHARED bira omotač)</text>

  <!-- izlazi -->
  <line x1="170" y1="560" x2="170" y2="633" stroke="#5f6368" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="180" y="600" font-size="10" fill="#202124" font-weight="600">o_x, o_y (afino k·P)</text>
  <line x1="876" y1="226" x2="876" y2="633" stroke="#5f6368" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="884" y="430" font-size="10" fill="#5f6368" transform="rotate(90 884 430)">o_busy, o_done</text>

  <!-- ============ 2:1 mux ============ -->
  <path d="M 520 300 L 630 300 L 630 388 L 520 388 L 520 355 L 545 344 L 520 333 Z" fill="#f3e8fd" stroke="#a142f4" stroke-width="1.8"/>
  <text x="586" y="336" text-anchor="middle" font-size="12" font-weight="700" fill="#7627bb">2 : 1</text>
  <text x="586" y="352" text-anchor="middle" font-size="10" fill="#7627bb">mux (A)</text>
  <text x="586" y="374" text-anchor="middle" font-size="8.5" fill="#5f6368">start/op/a/b</text>
  <!-- control from FSM -->
  <line x1="680" y1="226" x2="600" y2="298" stroke="#b06000" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="668" y="262" font-size="9" fill="#b06000">S_MXY → mxy drži ALU,</text>
  <text x="668" y="275" font-size="9" fill="#b06000">inače → lestvica</text>

  <!-- ============ gf_alu ============ -->
  <rect x="700" y="270" width="190" height="180" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.6"/>
  <text x="795" y="294" text-anchor="middle" font-size="13.5" font-weight="700" fill="#137333">gf_alu</text>
  <text x="795" y="310" text-anchor="middle" font-size="9.5" fill="#5f6368">izvršilac (A) zahteva</text>
  <rect x="716" y="320" width="158" height="30" rx="6" fill="#fff" stroke="#188038"/>
  <text x="795" y="339" text-anchor="middle" font-size="10.5" fill="#137333">gf_mul (digit-serial, G_D)</text>
  <rect x="716" y="356" width="158" height="28" rx="6" fill="#fff" stroke="#188038"/>
  <text x="795" y="374" text-anchor="middle" font-size="10" fill="#137333">gf_inv (Itoh–Tsujii, deli mul)</text>
  <rect x="716" y="390" width="75" height="26" rx="6" fill="#fff" stroke="#188038"/>
  <text x="753" y="407" text-anchor="middle" font-size="10" fill="#137333">gf_sqr</text>
  <rect x="799" y="390" width="75" height="26" rx="6" fill="#fff" stroke="#188038"/>
  <text x="836" y="407" text-anchor="middle" font-size="10" fill="#137333">gf_add</text>
  <text x="795" y="436" text-anchor="middle" font-size="8.5" fill="#5f6368">interni arbitar: direktni MUL / inv-klijent</text>

  <!-- ============ (A) magistrale ============ -->
  <polyline points="400,240 460,240 460,318 518,318" fill="none" stroke="#a142f4" stroke-width="3" marker-end="url(#ap)"/>
  <text x="466" y="308" font-size="11" font-weight="700" fill="#a142f4">(A)</text>
  <polyline points="400,480 460,480 460,370 518,370" fill="none" stroke="#a142f4" stroke-width="3" marker-end="url(#ap)"/>
  <text x="466" y="398" font-size="11" font-weight="700" fill="#a142f4">(A)</text>
  <line x1="630" y1="344" x2="698" y2="344" stroke="#a142f4" stroke-width="3" marker-end="url(#ap)"/>
  <text x="664" y="336" font-size="11" font-weight="700" fill="#a142f4">(A)</text>

  <!-- ============ legenda (A) ============ -->
  <rect x="470" y="470" width="420" height="120" rx="8" fill="#f3e8fd" stroke="#a142f4" stroke-width="1.4"/>
  <text x="680" y="493" text-anchor="middle" font-size="12" font-weight="700" fill="#7627bb">(A) = ALU-klijent magistrala — jedan tip interfejsa, 7 signala</text>
  <g font-size="10.5" fill="#202124">
    <text x="490" y="516">→  start   1-takt strob, sme tek kad je busy = 0</text>
    <text x="490" y="533">→  op ∈ {ALU_ADD, ALU_SQR, ALU_MUL, ALU_INV} · a, b (G_M bita)</text>
    <text x="490" y="550">←  busy (nivo) · done (1-takt puls, tad se čita res) · res (G_M bita)</text>
  </g>
  <text x="680" y="578" text-anchor="middle" font-size="9" fill="#5f6368">isti obrazac na svakom spratu: gf_inv je mul-klijent unutar gf_alu · step/mxy su (A) klijenti · mux = arbitar iz gf_alu.vhd</text>

  <!-- fusnota -->
  <text x="480" y="666" text-anchor="middle" font-size="10.5" fill="#5f6368">Vreme (B-571): S_LADDER ≈ 285k taktova (D=8) / 100k (D=32) · S_MXY ≈ 5k · refaktor: gf_alu je izvučen iz ec_scalar_mult u ecdh_top</text>
  <text x="480" y="694" text-anchor="middle" font-size="9.5" fill="#9aa0a6">ecdh_top.svg · avgust 2026 · nivo 1: ecdh_sistem.svg · nivo 2: ecdh_axis_ip.svg</text>
</svg>
