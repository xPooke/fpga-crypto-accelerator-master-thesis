<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#5f6368"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#b06000"/></marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8430ce"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="620" fill="#f7f7f5"/>
  <text x="480" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#202124">gf_mul — digit-serial množač sa utkanom redukcijom</text>
  <text x="480" y="51" text-anchor="middle" font-size="12.5" fill="#5f6368">MSB-first Horner: G_D ulančanih pod-koraka po taktu → ⌈m/G_D⌉ taktova · konstantno vreme · bez DSP</text>

  <!-- ============ datapath ============ -->
  <rect x="48" y="70" width="864" height="292" rx="10" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.4"/>
  <text x="64" y="92" font-size="13" font-weight="700" fill="#202124">Datapath (p_MULTIPLY — jedan takt = jedan digit)</text>

  <rect x="70" y="110" width="150" height="46" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.3"/>
  <text x="145" y="130" text-anchor="middle" font-size="11.5" font-weight="700" fill="#681da8">r_a (operand a)</text>
  <text x="145" y="147" text-anchor="middle" font-size="9" fill="#5f6368">indeksira se: idx = cnt·G_D + j</text>

  <rect x="70" y="170" width="150" height="46" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.3"/>
  <text x="145" y="190" text-anchor="middle" font-size="11.5" font-weight="700" fill="#681da8">r_b (operand b)</text>
  <text x="145" y="207" text-anchor="middle" font-size="9" fill="#5f6368">XOR-uje se kad je a(idx)=1</text>

  <rect x="70" y="230" width="150" height="46" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.3"/>
  <text x="145" y="250" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b06000">r_cnt (digit brojač)</text>
  <text x="145" y="267" text-anchor="middle" font-size="9" fill="#5f6368">q−1 … 0, q = ⌈m/G_D⌉</text>

  <!-- chained substeps -->
  <rect x="280" y="110" width="560" height="170" rx="10" fill="#fbfbfa" stroke="#8430ce" stroke-width="1.6"/>
  <text x="560" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#681da8">G_D ulančanih KOMBINACIONIH pod-koraka (bit_serial_mult)</text>

  <g font-size="9.5" fill="#202124">
    <rect x="300" y="148" width="150" height="96" rx="6" fill="#fff" stroke="#8430ce"/>
    <text x="375" y="166" text-anchor="middle" font-weight="700">pod-korak j = D−1</text>
    <text x="375" y="186" text-anchor="middle">acc·x  (šift ulevo 1)</text>
    <text x="375" y="202" text-anchor="middle">MSB ispao? XOR donji f</text>
    <text x="375" y="218" text-anchor="middle">a(idx)=1? acc ^= b</text>
    <text x="375" y="236" text-anchor="middle" fill="#5f6368">guard: idx &lt; m (padding)</text>
    <rect x="480" y="148" width="150" height="96" rx="6" fill="#fff" stroke="#8430ce"/>
    <text x="555" y="166" text-anchor="middle" font-weight="700">pod-korak j = D−2</text>
    <text x="555" y="200" text-anchor="middle">… isto …</text>
    <rect x="660" y="148" width="150" height="96" rx="6" fill="#fff" stroke="#8430ce"/>
    <text x="735" y="166" text-anchor="middle" font-weight="700">pod-korak j = 0</text>
    <text x="735" y="200" text-anchor="middle">… isto …</text>
  </g>
  <line x1="450" y1="196" x2="478" y2="196" stroke="#8430ce" stroke-width="1.6" marker-end="url(#ap)"/>
  <line x1="630" y1="196" x2="658" y2="196" stroke="#8430ce" stroke-width="1.6" marker-end="url(#ap)"/>

  <rect x="280" y="300" width="360" height="46" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.6"/>
  <text x="460" y="320" text-anchor="middle" font-size="11.5" font-weight="700" fill="#681da8">r_accumulator (m bita — nikad ne preraste!)</text>
  <text x="460" y="336" text-anchor="middle" font-size="9" fill="#5f6368">registruje se JEDNOM po taktu (posle svih D pod-koraka)</text>
  <path d="M 810 246 L 840 246 L 840 323 L 642 323" fill="none" stroke="#8430ce" stroke-width="1.6" marker-end="url(#ap)"/>
  <path d="M 280 323 L 250 323 L 250 196 L 278 196" fill="none" stroke="#8430ce" stroke-width="1.6" marker-end="url(#ap)"/>
  <text x="248" y="260" text-anchor="end" font-size="9" fill="#681da8">povratna sprega</text>

  <text x="64" y="356" font-size="9.5" fill="#5f6368">Redukcija ostaje JEDNOBITNA i u digit-serial režimu (svaki pod-korak šiftuje za 1) — ponovo se koristi isti reducer, ne pravi se višebitni.</text>

  <!-- ============ FSM ============ -->
  <rect x="48" y="376" width="864" height="196" rx="10" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.4"/>
  <text x="64" y="398" font-size="13" font-weight="700" fill="#202124">Mašina stanja (reset → S_IDLE)</text>

  <rect x="110" y="440" width="150" height="56" rx="28" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="185" y="472" text-anchor="middle" font-size="13" font-weight="700" fill="#b06000">S_IDLE</text>

  <rect x="400" y="440" width="180" height="56" rx="28" fill="#fff" stroke="#f9ab00" stroke-width="1.6"/>
  <text x="490" y="466" text-anchor="middle" font-size="13" font-weight="700" fill="#b06000">S_CALCULATE</text>
  <text x="490" y="482" text-anchor="middle" font-size="8.5" fill="#5f6368">1 digit / takt, o_busy=1</text>

  <rect x="720" y="440" width="150" height="56" rx="28" fill="#fff" stroke="#f9ab00" stroke-width="1.6"/>
  <text x="795" y="466" text-anchor="middle" font-size="13" font-weight="700" fill="#b06000">S_DONE</text>
  <text x="795" y="482" text-anchor="middle" font-size="8.5" fill="#5f6368">o_done=1, o_res važi</text>

  <line x1="260" y1="468" x2="398" y2="468" stroke="#b06000" stroke-width="1.8" marker-end="url(#ao)"/>
  <text x="329" y="458" text-anchor="middle" font-size="9.5" fill="#b06000" font-weight="600">i_start (snapshot a,b)</text>
  <line x1="580" y1="468" x2="718" y2="468" stroke="#b06000" stroke-width="1.8" marker-end="url(#ao)"/>
  <text x="649" y="458" text-anchor="middle" font-size="9.5" fill="#b06000" font-weight="600">r_cnt = 0</text>
  <path d="M 795 498 L 795 536 L 185 536 L 185 498" fill="none" stroke="#b06000" stroke-width="1.6" marker-end="url(#ao)"/>
  <text x="490" y="528" text-anchor="middle" font-size="9.5" fill="#b06000" font-weight="600">i_start = 0</text>
  <path d="M 730 442 C 690 406, 620 406, 588 442" fill="none" stroke="#188038" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="659" y="412" text-anchor="middle" font-size="9.5" fill="#188038" font-weight="700">i_start = 1 (back-to-back: S_DONE = load takt)</text>

  <text x="480" y="600" text-anchor="middle" font-size="9.5" fill="#9aa0a6">docs/gf_mul/gf_mul.svg · avgust 2026 · RTL: src/gf_mul.vhd</text>
</svg>
