<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#5f6368"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1a73e8"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#188038"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#c5221f"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="590" fill="#f7f7f5"/>
  <text x="480" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#202124">ECDH u sistemu — nivo 1: lanac jezgara</text>
  <text x="480" y="51" text-anchor="middle" font-size="12.5" fill="#5f6368">javno kroz DMA · tajna x(S) samo PL žicama ka SHA-3 · privatni ključ k ulazi side-band (RNG), nikad kroz softver</text>

  <!-- ============ PS ============ -->
  <rect x="40" y="150" width="180" height="180" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.4"/>
  <text x="130" y="176" text-anchor="middle" font-size="13.5" font-weight="700" fill="#174ea6">PS (Cortex-A53)</text>
  <text x="130" y="194" text-anchor="middle" font-size="10.5" fill="#5f6368">softver vodi protokol</text>
  <text x="130" y="209" text-anchor="middle" font-size="10.5" fill="#5f6368">(u tezi: testbench)</text>
  <rect x="60" y="224" width="140" height="48" rx="6" fill="#fff" stroke="#1a73e8"/>
  <text x="130" y="244" text-anchor="middle" font-size="11.5" font-weight="600" fill="#174ea6">DMA</text>
  <text x="130" y="260" text-anchor="middle" font-size="10" fill="#5f6368">MM2S / S2MM</text>
  <text x="130" y="294" text-anchor="middle" font-size="10" fill="#174ea6" font-weight="600">vidi SAMO javno:</text>
  <text x="130" y="309" text-anchor="middle" font-size="10" fill="#174ea6" font-weight="600">Qx, Qy, Qa — NE k</text>

  <!-- ============ PL granica ============ -->
  <rect x="260" y="92" width="660" height="358" rx="10" fill="none" stroke="#5f6368" stroke-width="1.4" stroke-dasharray="8 5"/>
  <text x="278" y="112" font-size="12" font-weight="700" fill="#5f6368">PL (programabilna logika)</text>

  <!-- ============ RNG ============ -->
  <rect x="300" y="120" width="230" height="46" rx="8" fill="#fce8e6" stroke="#c5221f" stroke-width="1.5"/>
  <text x="415" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#c5221f">RNG  (van opsega rada; u tezi: TB)</text>
  <text x="415" y="157" text-anchor="middle" font-size="9.5" fill="#5f6368">generiše privatni ključ k jednom po sesiji</text>

  <!-- ============ ecdh_axis_ip ============ -->
  <rect x="300" y="196" width="230" height="150" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.8"/>
  <text x="415" y="222" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b06000">ecdh_axis_ip</text>
  <text x="415" y="241" text-anchor="middle" font-size="11" fill="#5f6368">ECDH akcelerator — k·P nad GF(2⁵⁷¹)</text>
  <text x="415" y="258" text-anchor="middle" font-size="10.5" fill="#5f6368">koprocesor: jedan paket = jedna operacija</text>
  <text x="415" y="282" text-anchor="middle" font-size="10.5" fill="#202124">KEYGEN: Qa = k·G  →  m_axis (javno)</text>
  <text x="415" y="299" text-anchor="middle" font-size="10.5" fill="#137333" font-weight="600">SHARED: x(k·Q_tuđ)  →  m_axis_z (tajna)</text>
  <text x="415" y="326" text-anchor="middle" font-size="9.5" fill="#5f6368">generici: G_M, G_D, G_F, G_B, DATA_WIDTH</text>

  <!-- ============ SHA3 ============ -->
  <rect x="620" y="196" width="130" height="96" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.6"/>
  <text x="685" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#137333">sha3_axis_ip</text>
  <text x="685" y="241" text-anchor="middle" font-size="10.5" fill="#5f6368">cSHAKE-256</text>
  <text x="685" y="257" text-anchor="middle" font-size="10.5" fill="#5f6368">izvođenje ključa</text>
  <text x="685" y="278" text-anchor="middle" font-size="10" fill="#137333" font-weight="600">Z → K (256 b)</text>

  <!-- ============ AES-GCM ============ -->
  <rect x="790" y="196" width="110" height="96" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.6"/>
  <text x="845" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#137333">gcm_enc</text>
  <text x="845" y="241" text-anchor="middle" font-size="10.5" fill="#5f6368">AES-256 GCM</text>
  <text x="845" y="257" text-anchor="middle" font-size="10.5" fill="#5f6368">saobraćaj</text>
  <text x="845" y="278" text-anchor="middle" font-size="10" fill="#137333" font-weight="600">i_key ⇐ K</text>

  <!-- ============ strelice ============ -->
  <!-- RNG -> ecdh (k private, strob) -->
  <line x1="415" y1="166" x2="415" y2="194" stroke="#c5221f" stroke-width="2.4" marker-end="url(#ar)"/>
  <text x="425" y="184" font-size="10" fill="#c5221f" font-weight="700">i_k (571) + i_k_valid (strob)</text>
  <!-- s_axis: PS -> ecdh -->
  <line x1="220" y1="238" x2="298" y2="238" stroke="#1a73e8" stroke-width="2.2" marker-end="url(#ab)"/>
  <text x="259" y="229" text-anchor="middle" font-size="10.5" fill="#1a73e8" font-weight="600">s_axis</text>
  <text x="259" y="253" text-anchor="middle" font-size="9" fill="#5f6368">cmd‖Qx‖Qy</text>
  <!-- m_axis: ecdh -> PS -->
  <line x1="300" y1="300" x2="222" y2="300" stroke="#1a73e8" stroke-width="2.2" marker-end="url(#ab)"/>
  <text x="259" y="291" text-anchor="middle" font-size="10.5" fill="#1a73e8" font-weight="600">m_axis</text>
  <text x="259" y="315" text-anchor="middle" font-size="9" fill="#5f6368">javno: Qa = k·G</text>
  <!-- m_axis_z: ecdh -> SHA3 -->
  <line x1="530" y1="244" x2="618" y2="244" stroke="#188038" stroke-width="2.6" marker-end="url(#ag)"/>
  <text x="574" y="235" text-anchor="middle" font-size="10.5" fill="#188038" font-weight="700">m_axis_z</text>
  <text x="574" y="259" text-anchor="middle" font-size="9" fill="#137333">TAJNA x(S)</text>
  <!-- SHA3 -> AES -->
  <line x1="750" y1="244" x2="788" y2="244" stroke="#188038" stroke-width="2.6" marker-end="url(#ag)"/>
  <text x="769" y="235" text-anchor="middle" font-size="10" fill="#188038" font-weight="700">K</text>

  <!-- ============ bezbednosna napomena ============ -->
  <rect x="260" y="366" width="660" height="58" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.4"/>
  <text x="590" y="389" text-anchor="middle" font-size="11.5" font-weight="700" fill="#137333">Bezbednosna osobina (teza §4.5): tajne nikad ne napuštaju PL</text>
  <text x="590" y="409" text-anchor="middle" font-size="10.5" fill="#202124">privatni k: RNG → ECDH žicama · deljena x(S) i K: m_axis_z → SHA-3 → i_key · nijedna tajna nema put do PS memorije</text>

  <!-- ============ fusnota ============ -->
  <text x="480" y="462" text-anchor="middle" font-size="10.5" fill="#5f6368">Verifikacija: svako jezgro nezavisno (GHDL vektori iz Python zlatnog modela) · celina = post-implementaciona simulacija lanca,</text>
  <text x="480" y="479" text-anchor="middle" font-size="10.5" fill="#5f6368">testbench glumi PS/DMA i RNG · KEYGEN šalje G kao Qx/Qy — jezgro je čista k·P mašina, protokol živi iznad</text>

  <text x="480" y="560" text-anchor="middle" font-size="9.5" fill="#9aa0a6">ecdh_sistem.svg · avgust 2026 · prati: ecdh_axis_ip.svg (nivo 2), ecdh_top.svg (nivo 3)</text>
</svg>
