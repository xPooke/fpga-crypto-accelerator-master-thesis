<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect id="bg" x="0" y="0" width="100%" height="100%" fill="#FFFFFF"/>

  <!-- ======================= crypto boundary ======================= -->
  <rect x="292" y="150" width="216" height="106" rx="10" fill="none"
        stroke="#6D28D9" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="400" y="164" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5B21B6">crypto boundary</text>

  <!-- ======================= modules ======================= -->
  <!-- S_AXIS_IN (port) -->
  <rect x="30" y="40" width="110" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="85" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">S_AXIS_IN</text>
  <text x="85" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">AAD &#8214; PT</text>

  <!-- byte_reverse in -->
  <rect x="170" y="48" width="110" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="225" y="62" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#085041">byte_reverse</text>
  <text x="225" y="77" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">AXIS &#8594; block order</text>

  <!-- axis_demux -->
  <rect x="310" y="40" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="400" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">axis_demux</text>
  <text x="400" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">AAD / PT split + lengths</text>

  <!-- KEY / IV (port) -->
  <rect x="30" y="184" width="110" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="85" y="204" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">KEY / IV</text>
  <text x="85" y="222" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">i_key, i_IV</text>

  <!-- CRYPTO ALG (external) -->
  <rect x="310" y="180" width="180" height="66" rx="8" fill="#EFEAFB" stroke="#6D28D9" stroke-width="0.5"/>
  <text x="400" y="199" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#5B21B6">CRYPTO ALG</text>
  <text x="400" y="217" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#6D28D9">PT &#8853; keystream &#8594; CT</text>
  <text x="400" y="233" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#6D28D9">H = E(0),&#8195;E(J0)</text>

  <!-- AAD broadcaster -->
  <rect x="30" y="300" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="120" y="320" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">axis_broadcaster</text>
  <text x="120" y="338" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">AAD &#215;2</text>

  <!-- CT broadcaster -->
  <rect x="310" y="300" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="400" y="320" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">axis_broadcaster</text>
  <text x="400" y="338" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">CT &#215;2</text>

  <!-- axis_ghash_mux -->
  <rect x="570" y="180" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="660" y="200" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">axis_ghash_mux</text>
  <text x="660" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">AAD then CT, in order</text>

  <!-- H-freshness gate (separate from the skid buffer) -->
  <rect x="570" y="272" width="180" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="660" y="286" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#085041">H-freshness gate</text>
  <text x="660" y="301" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">holds a packet while h_stale</text>

  <!-- skid buffer -->
  <rect x="570" y="330" width="180" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="660" y="344" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#085041">AXIS_skid_buffer</text>
  <text x="660" y="359" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">1-deep, breaks TREADY</text>

  <!-- GHASH wrapper -->
  <rect x="570" y="392" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="660" y="412" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">GHASH_wrapper</text>
  <text x="660" y="430" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">absorb blocks + lengths</text>

  <!-- Tag Finalizer -->
  <rect x="570" y="492" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="660" y="512" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Tag_Finalizer</text>
  <text x="660" y="530" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Y &#8853; E(J0) &#8594; ICV</text>

  <!-- axis_mux -->
  <rect x="140" y="612" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="290" y="632" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">axis_mux</text>
  <text x="290" y="650" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">AAD &#8594; CT &#8594; ICV assembly</text>

  <!-- byte_reverse out -->
  <rect x="474" y="620" width="110" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="529" y="634" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#085041">byte_reverse</text>
  <text x="529" y="649" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">block order &#8594; AXIS</text>

  <!-- M_AXIS_OUT (port) -->
  <rect x="620" y="612" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="685" y="632" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">M_AXIS_OUT</text>
  <text x="685" y="650" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">AAD &#8214; CT &#8214; ICV</text>

  <!-- ======================= AXIS arrows (solid) ======================= -->
  <g fill="none" stroke="#2C2C2A" stroke-width="1.5">
    <path d="M140 68 L170 68" marker-end="url(#arrowhead)"/>
    <path d="M280 68 L310 68" marker-end="url(#arrowhead)"/>
    <!-- demux -> AAD bc  (own corridor on the left, no crossings) -->
    <path d="M340 96 L340 122 L120 122 L120 300" marker-end="url(#arrowhead)"/>
    <!-- demux -> CRYPTO : PT -->
    <path d="M440 96 L440 180" marker-end="url(#arrowhead)"/>
    <!-- CRYPTO -> CT bc -->
    <path d="M400 246 L400 300" marker-end="url(#arrowhead)"/>
    <!-- AAD bc (m1) -> ghash_mux -->
    <path d="M210 312 L240 312 L240 268 L546 268 L546 208 L570 208" marker-end="url(#arrowhead)"/>
    <!-- CT bc (m1) -> ghash_mux -->
    <path d="M490 314 L520 314 L520 222 L570 222" marker-end="url(#arrowhead)"/>
    <!-- ghash_mux -> gate -> skid -> GHASH -->
    <path d="M660 236 L660 272" marker-end="url(#arrowhead)"/>
    <path d="M660 312 L660 330" marker-end="url(#arrowhead)"/>
    <path d="M660 370 L660 392" marker-end="url(#arrowhead)"/>
    <!-- AAD bc (m2) -> axis_mux -->
    <path d="M120 356 L120 640 L140 640" marker-end="url(#arrowhead)"/>
    <!-- CT bc (m2) -> axis_mux -->
    <path d="M350 356 L350 612" marker-end="url(#arrowhead)"/>
    <!-- Tag_Finalizer -> axis_mux -->
    <path d="M660 548 L660 580 L410 580 L410 612" marker-end="url(#arrowhead)"/>
    <!-- axis_mux -> byte_reverse -> M_AXIS -->
    <path d="M440 640 L474 640" marker-end="url(#arrowhead)"/>
    <path d="M584 640 L620 640" marker-end="url(#arrowhead)"/>
  </g>

  <!-- ======================= side-band (orange dashed) ======================= -->
  <g fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3">
    <!-- key / IV passed straight through to the algorithm -->
    <path d="M140 212 L310 212" marker-end="url(#arrowhead)"/>
    <!-- CRYPTO -> GHASH : H (+ h_stale, which drives the gate) -->
    <path d="M310 196 L294 196 L294 420 L570 420" marker-end="url(#arrowhead)"/>
    <!-- CRYPTO -> Tag_Finalizer : E(J0) -->
    <path d="M310 232 L276 232 L276 520 L570 520" marker-end="url(#arrowhead)"/>
    <!-- GHASH -> Tag_Finalizer : Y -->
    <path d="M660 448 L660 492" marker-end="url(#arrowhead)"/>
    <!-- demux -> GHASH : bit lengths -->
    <path d="M490 54 L770 54 L770 406 L750 406" marker-end="url(#arrowhead)"/>
  </g>

  <!-- ======================= arrow labels ======================= -->
  <g font-size="12" fill="#2C2C2A">
    <text x="248" y="116">AAD</text>
    <text x="448" y="144">PT</text>
    <text x="408" y="280">CT</text>
    <text x="330" y="262">AAD</text>
    <text x="496" y="300">CT</text>
    <text x="86"  y="480">AAD</text>
    <text x="358" y="500">CT</text>
    <text x="430" y="574">ICV</text>
  </g>
  <g font-size="12" fill="#993C1D">
    <text x="176" y="206">key / IV</text>
    <text x="404" y="414">H, h_stale</text>
    <text x="404" y="514">E(J0)</text>
    <text x="668" y="476">Y</text>
    <text x="580" y="48">aad / ct bit len</text>
  </g>

  <!-- ======================= legend ======================= -->
  <g font-size="12">
    <rect x="30" y="726" width="18" height="18" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="56" y="735" dominant-baseline="central" fill="#2C2C2A">Custom RTL</text>

    <rect x="150" y="726" width="18" height="18" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="176" y="735" dominant-baseline="central" fill="#2C2C2A">Top-level port</text>

    <rect x="290" y="726" width="18" height="18" rx="4" fill="#EFEAFB" stroke="#6D28D9" stroke-width="0.5"/>
    <text x="316" y="735" dominant-baseline="central" fill="#2C2C2A">External algorithm</text>

    <path d="M470 735 L516 735" fill="none" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="524" y="735" dominant-baseline="central" fill="#2C2C2A">AXI Stream</text>

    <path d="M620 735 L666 735" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowhead)"/>
    <text x="674" y="735" dominant-baseline="central" fill="#2C2C2A">Side-band</text>
  </g>
</svg>
