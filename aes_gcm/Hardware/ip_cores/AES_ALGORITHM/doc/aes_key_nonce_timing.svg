<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="100%" height="100%" fill="#FFFFFF"/>

  <text x="30" y="26" font-size="15" font-weight="600" fill="#2C2C2A">Key / nonce timing — on-the-fly KeyExpansion and the packet-boundary swap</text>
  <text x="30" y="44" font-size="12" fill="#5F5E5A">A key and a nonce arriving mid-packet are shadowed and applied at the flush cycle; the packet in flight is never disturbed.</text>

  <!-- clock grid -->
  <g stroke="#D8D6D0" stroke-width="0.8">
    <line x1="150" y1="70" x2="150" y2="470"/>
    <line x1="230" y1="70" x2="230" y2="470"/>
    <line x1="310" y1="70" x2="310" y2="470"/>
    <line x1="390" y1="70" x2="390" y2="470"/>
    <line x1="470" y1="70" x2="470" y2="470"/>
    <line x1="550" y1="70" x2="550" y2="470"/>
    <line x1="630" y1="70" x2="630" y2="470"/>
    <line x1="710" y1="70" x2="710" y2="470"/>
    <line x1="790" y1="70" x2="790" y2="470"/>
  </g>

  <!-- clock labels -->
  <g font-size="10.5" fill="#5F5E5A" text-anchor="middle">
    <text x="190" y="66">t0</text>
    <text x="270" y="66">t1</text>
    <text x="350" y="66">t2</text>
    <text x="430" y="66">t3</text>
    <text x="510" y="66">t4 (TLAST)</text>
    <text x="590" y="66">t5 (flush)</text>
    <text x="670" y="66">t6</text>
    <text x="750" y="66">t7</text>
  </g>

  <!-- ============ row: i_key_valid / i_nonce_valid ============ -->
  <text x="140" y="100" text-anchor="end" font-size="11.5" fill="#2C2C2A">i_key_valid</text>
  <text x="140" y="118" text-anchor="end" font-size="11.5" fill="#2C2C2A">i_nonce_valid</text>
  <rect x="310" y="88" width="80" height="38" rx="4" fill="#FDF3D4" stroke="#B58A00" stroke-width="0.8"/>
  <text x="350" y="102" text-anchor="middle" font-size="11" font-weight="500" fill="#7A5C00">K2 / N2</text>
  <text x="350" y="117" text-anchor="middle" font-size="10.5" fill="#7A5C00">pulse</text>

  <!-- ============ row: AXIS packet ============ -->
  <text x="140" y="165" text-anchor="end" font-size="11.5" fill="#2C2C2A">s_axis (packet A)</text>
  <rect x="150" y="148" width="400" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="350" y="165" text-anchor="middle" font-size="11.5" fill="#085041">PT beats — key K1, nonce N1</text>
  <rect x="630" y="148" width="240" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="750" y="165" text-anchor="middle" font-size="11.5" fill="#085041">PT beats — key K2, nonce N2</text>

  <!-- ============ row: active registers ============ -->
  <text x="140" y="220" text-anchor="end" font-size="11.5" fill="#2C2C2A">r_active_key</text>
  <text x="140" y="238" text-anchor="end" font-size="11.5" fill="#2C2C2A">r_active_IV (J0)</text>
  <rect x="150" y="208" width="440" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="370" y="222" text-anchor="middle" font-size="11.5" font-weight="500" fill="#2C2C2A">K1</text>
  <text x="370" y="238" text-anchor="middle" font-size="11" fill="#444441">J0 = N1 ‖ 0³¹‖1, counter advancing</text>
  <rect x="590" y="208" width="280" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="730" y="222" text-anchor="middle" font-size="11.5" font-weight="500" fill="#2C2C2A">K2</text>
  <text x="730" y="238" text-anchor="middle" font-size="11" fill="#444441">J0 = N2 ‖ 0³¹‖1</text>

  <!-- ============ row: shadow registers ============ -->
  <text x="140" y="285" text-anchor="end" font-size="11.5" fill="#2C2C2A">r_shadow_key</text>
  <text x="140" y="303" text-anchor="end" font-size="11.5" fill="#2C2C2A">r_shadow_IV</text>
  <rect x="390" y="273" width="200" height="38" rx="4" fill="#FDF3D4" stroke="#B58A00" stroke-width="0.8"/>
  <text x="490" y="292" text-anchor="middle" font-size="11.5" fill="#7A5C00">K2 / N2 held (packet A still in flight)</text>
  <path d="M390 292 L318 292" fill="none" stroke="#B58A00" stroke-width="1.3" marker-end="url(#arrowhead)"/>
  <path d="M540 273 L582 252" fill="none" stroke="#B58A00" stroke-width="1.3" marker-end="url(#arrowhead)"/>
  <text x="600" y="268" font-size="10.5" fill="#7A5C00">applied at flush</text>

  <!-- ============ row: KeyExpansion ============ -->
  <text x="140" y="350" text-anchor="end" font-size="11.5" fill="#2C2C2A">KeyExpansion</text>
  <rect x="150" y="333" width="440" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="370" y="350" text-anchor="middle" font-size="11" fill="#085041">K1 round keys — produced one cycle ahead of the cores, in lockstep</text>
  <rect x="590" y="333" width="80" height="34" rx="4" fill="#FDF3D4" stroke="#B58A00" stroke-width="0.8"/>
  <text x="630" y="350" text-anchor="middle" font-size="10.5" fill="#7A5C00">restart</text>
  <rect x="670" y="333" width="200" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="770" y="350" text-anchor="middle" font-size="11" fill="#085041">K2 round keys</text>

  <!-- ============ row: dispatch enable ============ -->
  <text x="140" y="400" text-anchor="end" font-size="11.5" fill="#2C2C2A">w_dispatch_enable</text>
  <rect x="150" y="383" width="440" height="34" rx="4" fill="#EAF2FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="370" y="400" text-anchor="middle" font-size="11" fill="#0C447C">high</text>
  <rect x="590" y="383" width="80" height="34" rx="4" fill="#FBEAEA" stroke="#993C1D" stroke-width="0.8"/>
  <text x="630" y="400" text-anchor="middle" font-size="10" fill="#993C1D">delay</text>
  <rect x="670" y="383" width="200" height="34" rx="4" fill="#EAF2FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="770" y="400" text-anchor="middle" font-size="11" fill="#0C447C">high</text>

  <!-- ============ row: H / EK ============ -->
  <text x="140" y="450" text-anchor="end" font-size="11.5" fill="#2C2C2A">o_h_stale</text>
  <rect x="590" y="433" width="160" height="34" rx="4" fill="#FBEAEA" stroke="#993C1D" stroke-width="0.8"/>
  <text x="670" y="450" text-anchor="middle" font-size="10.5" fill="#993C1D">H stale until E(0) recomputed</text>

  <!-- flush marker -->
  <line x1="590" y1="80" x2="590" y2="470" stroke="#993C1D" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="596" y="486" font-size="11" font-weight="500" fill="#993C1D">flush: shadow → active, KE restarts, H marked stale</text>

  <!-- notes -->
  <text x="30" y="516" font-size="11" fill="#5F5E5A">• A key or nonce pulse on the flush cycle itself wins over an already staged shadow (latest-wins), so no update is ever dropped.</text>
  <text x="30" y="534" font-size="11" fill="#5F5E5A">• If no nonce is staged, r_have_nonce clears at flush: the next packet cannot start until a fresh nonce is pulsed (IV-reuse guard).</text>
  <text x="30" y="552" font-size="11" fill="#5F5E5A">• c_DISPATCH_DELAY is 1 cycle for AES-128 and 0 for AES-256 — it aligns the first dispatch with K₀/K₁ becoming valid out of the KeyExpansion.</text>
</svg>
