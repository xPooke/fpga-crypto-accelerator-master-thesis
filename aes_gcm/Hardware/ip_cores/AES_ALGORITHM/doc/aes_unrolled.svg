<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="100%" height="100%" fill="#FFFFFF"/>

  <text x="30" y="26" font-size="15" font-weight="600" fill="#2C2C2A">WRAPPER_KIND = "UNROLLED"  —  AES_pipelined_wrapper</text>
  <text x="30" y="44" font-size="12" fill="#5F5E5A">One fully pipelined core, NR+2 stages. Steady state: 1 block / clock.</text>

  <!-- ================= left column ================= -->
  <rect x="30" y="70" width="140" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="100" y="88" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A">KEY / NONCE</text>
  <text x="100" y="105" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">i_key, i_nonce</text>

  <rect x="30" y="150" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="100" y="169" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">KeyExpansion</text>
  <text x="100" y="187" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">4 words / clk</text>

  <rect x="30" y="240" width="140" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="100" y="258" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">block scheduler</text>
  <text x="100" y="276" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">H &#8594; E(J0) &#8594; CT&#8230;</text>
  <text x="100" y="292" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">tags each block</text>
  <text x="100" y="307" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">on TUSER</text>

  <text x="30" y="350" font-size="11" fill="#5F5E5A">Pushed back-to-back,</text>
  <text x="30" y="365" font-size="11" fill="#5F5E5A">no gap between roles:</text>
  <text x="30" y="384" font-size="11" fill="#993C1D">H&#160;=&#160;E(0)</text>
  <text x="30" y="399" font-size="11" fill="#993C1D">E(J0)</text>
  <text x="30" y="414" font-size="11" fill="#993C1D">E(J0+1), E(J0+2) &#8230;</text>

  <!-- round-key bus -->
  <path d="M100 206 L100 224 L196 224 L196 120" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M196 130 L196 440" fill="none" stroke="#D85A30" stroke-width="2"/>
  <text x="192" y="137" text-anchor="end" font-size="10.5" font-weight="600" fill="#993C1D">K0 <text x="193" y="112" text-anchor="end" font-size="11" font-weight="600" fill="#993C1D">K0 &#8230; K_NR</text>#8230; K_NR</text>

  <!-- scheduler -> pipeline -->
  <path d="M170 278 L214 278 L214 150 L238 150" fill="none" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ================= the pipeline ================= -->
  <rect x="236" y="80" width="330" height="392" rx="10" fill="#F7FCFA" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="401" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041">aes_enc_pipelined</text>

  <g font-size="11.5">
    <rect x="252" y="128" width="222" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="363" y="142" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#085041">stage 0</text>
    <text x="363" y="157" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#0F6E56">AddRoundKey (K0)</text>

    <rect x="252" y="184" width="222" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="363" y="198" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#085041">stage 1 &#8212; aes_round</text>
    <text x="363" y="213" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#0F6E56">SB+SR+MC+AK &#183; BRAM or LUT</text>

    <rect x="252" y="240" width="222" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="363" y="254" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#085041">stage 2 &#8212; aes_round</text>
    <text x="363" y="269" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#0F6E56">one round = one stage</text>

    <text x="363" y="300" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#0F6E56">&#8942;</text>
    <text x="363" y="320" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#5F5E5A">stages 3 &#8230; NR&#8722;1</text>

    <rect x="252" y="344" width="222" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="363" y="358" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#085041">stage NR &#8212; pre-last register</text>
    <text x="363" y="373" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#0F6E56">timing buffer: breaks BRAM &#8594; LUT path</text>

    <rect x="252" y="404" width="222" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="363" y="418" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#085041">stage NR+1 &#8212; last round</text>
    <text x="363" y="433" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#0F6E56">SB+SR+AK, no MixColumns &#183; always LUT</text>
  </g>

  <!-- stage-to-stage arrows -->
  <g fill="none" stroke="#2C2C2A" stroke-width="1.5">
    <path d="M363 168 L363 184" marker-end="url(#arrowhead)"/>
    <path d="M363 224 L363 240" marker-end="url(#arrowhead)"/>
    <path d="M363 280 L363 292" marker-end="url(#arrowhead)"/>
    <path d="M363 328 L363 344" marker-end="url(#arrowhead)"/>
    <path d="M363 388 L363 404" marker-end="url(#arrowhead)"/>
  </g>

  <!-- round keys into each stage -->
  <g fill="none" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="3 3">
    <path d="M196 148 L250 148" marker-end="url(#arrowhead)"/>
    <path d="M196 204 L250 204" marker-end="url(#arrowhead)"/>
    <path d="M196 260 L250 260" marker-end="url(#arrowhead)"/>
    <path d="M196 426 L250 426" marker-end="url(#arrowhead)"/>
  </g>

  <!-- valid + TUSER shift column -->
  <rect x="492" y="128" width="60" height="320" rx="6" fill="#FDF6EE" stroke="#D85A30" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="522" y="146" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#993C1D">valid</text>
  <text x="522" y="160" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#993C1D">+ TUSER</text>
  <text x="522" y="188" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#993C1D">shifts</text>
  <text x="522" y="202" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#993C1D">stage by</text>
  <text x="522" y="216" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#993C1D">stage,</text>
  <text x="522" y="230" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#993C1D">beside</text>
  <text x="522" y="244" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#993C1D">the data</text>
  <text x="522" y="290" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#5F5E5A">the tag</text>
  <text x="522" y="304" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#5F5E5A">says what</text>
  <text x="522" y="318" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#5F5E5A">the block</text>
  <text x="522" y="332" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#5F5E5A">IS</text>

  <!-- pipeline -> demux -->
  <path d="M474 426 L560 426 L560 300 L600 300" fill="none" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ================= output demux ================= -->
  <rect x="602" y="270" width="150" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="677" y="288" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">output demux</text>
  <text x="677" y="306" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">routes by TUSER</text>
  <text x="677" y="320" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5F5E5A">H / E(J0) / CT</text>

  <!-- H and EK out -->
  <path d="M752 284 L790 284 L790 150 L806 150" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowhead)"/>
  <path d="M752 296 L772 296 L772 222 L806 222" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowhead)"/>

  <rect x="808" y="126" width="86" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="851" y="143" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#2C2C2A">o_H</text>
  <text x="851" y="159" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#444441">= E(0)</text>

  <rect x="808" y="198" width="86" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="851" y="215" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#2C2C2A">o_E_k</text>
  <text x="851" y="231" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#444441">= E(J0)</text>

  <!-- keystream -> XOR -->
  <path d="M677 330 L677 380" fill="none" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="686" y="358" font-size="10.5" fill="#5F5E5A">keystream</text>

  <circle cx="677" cy="398" r="17" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.5"/>
  <text x="677" y="399" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#2C2C2A">&#8853;</text>

  <!-- PT in -->
  <rect x="580" y="470" width="120" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="640" y="487" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#2C2C2A">S_AXIS_IN</text>
  <text x="640" y="504" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#444441">PT (or CT on decrypt)</text>
  <path d="M640 468 L640 398 L658 398" fill="none" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- CT out -->
  <path d="M694 398 L790 398" fill="none" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <rect x="792" y="374" width="102" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="843" y="391" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#2C2C2A">M_AXIS_OUT</text>
  <text x="843" y="408" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#444441">CT (or PT)</text>

  <!-- note -->
  <text x="580" y="556" font-size="11" fill="#5F5E5A">The cipher is never inverted: both</text>
  <text x="580" y="572" font-size="11" fill="#5F5E5A">directions are the same XOR.</text>

  <!-- ================= legend ================= -->
  <g font-size="11.5">
    <rect x="30" y="620" width="16" height="16" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="54" y="628" dominant-baseline="central" fill="#2C2C2A">Custom RTL</text>

    <rect x="150" y="620" width="16" height="16" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="174" y="628" dominant-baseline="central" fill="#2C2C2A">Top-level port</text>

    <path d="M290 628 L332 628" fill="none" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="340" y="628" dominant-baseline="central" fill="#2C2C2A">Data path</text>

    <path d="M430 628 L472 628" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowhead)"/>
    <text x="480" y="628" dominant-baseline="central" fill="#2C2C2A">Keys / side-band</text>
  </g>
</svg>
