<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 545" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="545" fill="#ffffff"/>
  <text x="24" y="30" font-size="19" font-weight="700" fill="#0f172a">ABSORB — a partial input beat (no output)</text>
  <text x="24" y="50" font-size="12" fill="#64748b">example: r_gb_count = 2, the input carries 5 valid bytes (tkeep = 0x001F), bus = 16 B     ·     this is the end of the AAD, or the end of the CT</text>

  <!-- lane ruler -->
  <text x="150" y="86" font-size="10" text-anchor="end" fill="#64748b">lane:</text>
  <text x="169" y="86" font-size="9" text-anchor="middle" fill="#64748b">0</text>
  <text x="197" y="86" font-size="9" text-anchor="middle" fill="#64748b">1</text>
  <text x="225" y="86" font-size="9" text-anchor="middle" fill="#64748b">2</text>
  <text x="253" y="86" font-size="9" text-anchor="middle" fill="#64748b">3</text>
  <text x="281" y="86" font-size="9" text-anchor="middle" fill="#64748b">4</text>
  <text x="309" y="86" font-size="9" text-anchor="middle" fill="#64748b">5</text>
  <text x="337" y="86" font-size="9" text-anchor="middle" fill="#64748b">6</text>
  <text x="589" y="86" font-size="9" text-anchor="middle" fill="#64748b">15</text>
  <text x="617" y="86" font-size="9" text-anchor="middle" fill="#64748b">16</text>
  <text x="762" y="86" font-size="9" text-anchor="end" fill="#64748b">LSB → MSB</text>

  <!-- ===== Row A: input (masked) ===== -->
  <text x="150" y="120" font-size="12" font-weight="700" text-anchor="end" fill="#0f172a">INPUT</text>
  <text x="150" y="134" font-size="9" text-anchor="end" fill="#64748b">(masked)</text>
  <g font-size="9" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="155" y="104" width="28" height="30" rx="2" fill="#3b82f6"/><text x="169" y="123">I0</text>
    <rect x="183" y="104" width="28" height="30" rx="2" fill="#3b82f6"/><text x="197" y="123">I1</text>
    <rect x="211" y="104" width="28" height="30" rx="2" fill="#3b82f6"/><text x="225" y="123">I2</text>
    <rect x="239" y="104" width="28" height="30" rx="2" fill="#3b82f6"/><text x="253" y="123">I3</text>
    <rect x="267" y="104" width="28" height="30" rx="2" fill="#3b82f6"/><text x="281" y="123">I4</text>
    <rect x="295" y="104" width="308" height="30" rx="2" fill="#e2e8f0" stroke="#cbd5e1"/>
    <text x="449" y="123" fill="#94a3b8" font-size="10">0  —  mask_bytes() zeroes every lane whose tkeep bit is 0</text>
  </g>
  <text x="620" y="123" font-size="9" font-weight="700" fill="#0ea5e9">keep_bytes = 5</text>

  <!-- shift annotation -->
  <path d="M169,140 C169,158 225,152 225,168" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr2)"/>
  <text x="407" y="158" font-size="11" font-weight="700" text-anchor="middle" fill="#0ea5e9">« shift_left by r_gb_count = 2 bytes »</text>

  <!-- ===== Row B: shifted ===== -->
  <text x="150" y="190" font-size="12" font-weight="700" text-anchor="end" fill="#0f172a">INPUT « 2</text>
  <g font-size="9" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="155" y="174" width="28" height="30" rx="2" fill="#e2e8f0" stroke="#cbd5e1"/><text x="169" y="193" fill="#94a3b8">0</text>
    <rect x="183" y="174" width="28" height="30" rx="2" fill="#e2e8f0" stroke="#cbd5e1"/><text x="197" y="193" fill="#94a3b8">0</text>
    <rect x="211" y="174" width="28" height="30" rx="2" fill="#3b82f6"/><text x="225" y="193">I0</text>
    <rect x="239" y="174" width="28" height="30" rx="2" fill="#3b82f6"/><text x="253" y="193">I1</text>
    <rect x="267" y="174" width="28" height="30" rx="2" fill="#3b82f6"/><text x="281" y="193">I2</text>
    <rect x="295" y="174" width="28" height="30" rx="2" fill="#3b82f6"/><text x="309" y="193">I3</text>
    <rect x="323" y="174" width="28" height="30" rx="2" fill="#3b82f6"/><text x="337" y="193">I4</text>
    <rect x="351" y="174" width="252" height="30" rx="2" fill="#e2e8f0" stroke="#cbd5e1"/><text x="477" y="193" fill="#94a3b8" font-size="10">0</text>
  </g>

  <!-- ===== Row C: carry ===== -->
  <text x="150" y="260" font-size="12" font-weight="700" text-anchor="end" fill="#0f172a">CARRY</text>
  <text x="150" y="274" font-size="9" text-anchor="end" fill="#64748b">r_gearbox (2 B)</text>
  <g font-size="9" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="155" y="244" width="28" height="30" rx="2" fill="#8b5cf6"/><text x="169" y="263">C0</text>
    <rect x="183" y="244" width="28" height="30" rx="2" fill="#8b5cf6"/><text x="197" y="263">C1</text>
    <rect x="211" y="244" width="392" height="30" rx="2" fill="#e2e8f0" stroke="#cbd5e1"/><text x="407" y="263" fill="#94a3b8" font-size="10">0</text>
  </g>

  <text x="407" y="302" font-size="15" font-weight="700" text-anchor="middle" fill="#64748b">OR  ↓</text>

  <!-- ===== Row D: merged ===== -->
  <text x="150" y="340" font-size="12" font-weight="700" text-anchor="end" fill="#0f172a">w_merged</text>
  <g font-size="9" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="155" y="324" width="28" height="30" rx="2" fill="#8b5cf6"/><text x="169" y="343">C0</text>
    <rect x="183" y="324" width="28" height="30" rx="2" fill="#8b5cf6"/><text x="197" y="343">C1</text>
    <rect x="211" y="324" width="28" height="30" rx="2" fill="#3b82f6"/><text x="225" y="343">I0</text>
    <rect x="239" y="324" width="28" height="30" rx="2" fill="#3b82f6"/><text x="253" y="343">I1</text>
    <rect x="267" y="324" width="28" height="30" rx="2" fill="#3b82f6"/><text x="281" y="343">I2</text>
    <rect x="295" y="324" width="28" height="30" rx="2" fill="#3b82f6"/><text x="309" y="343">I3</text>
    <rect x="323" y="324" width="28" height="30" rx="2" fill="#3b82f6"/><text x="337" y="343">I4</text>
    <rect x="351" y="324" width="252" height="30" rx="2" fill="#e2e8f0" stroke="#cbd5e1"/><text x="477" y="343" fill="#94a3b8" font-size="10">0</text>
  </g>

  <!-- bus boundary at lane 16 -->
  <line x1="603" y1="100" x2="603" y2="366" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="612" y="368" font-size="9" fill="#94a3b8">beat boundary (16 B) — nothing crosses it</text>

  <!-- new carry bracket over lanes 0..6 -->
  <path d="M155,372 L155,382 L351,382 L351,372" fill="none" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="253" y="400" font-size="11" font-weight="700" text-anchor="middle" fill="#d97706">new carry = w_merged[low 7 B]</text>
  <text x="253" y="414" font-size="10" font-weight="700" text-anchor="middle" fill="#d97706">r_gb_count : 2 → 7</text>

  <!-- decision box -->
  <rect x="420" y="376" width="336" height="52" rx="6" fill="#fef2f2" stroke="#ef4444"/>
  <text x="588" y="396" font-size="12" font-weight="700" text-anchor="middle" fill="#b91c1c">total = 2 + 5 = 7  &lt;  16  →  ABSORB</text>
  <text x="588" y="416" font-size="11" text-anchor="middle" fill="#b91c1c">m_axis_tvalid = '0'  —  NO output beat</text>

  <!-- notes -->
  <text x="24" y="464" font-size="12" font-weight="700" fill="#0f172a">Key points</text>
  <text x="24" y="484" font-size="11" fill="#0f172a">• The input <tspan font-weight="700">is still consumed</tspan> (tready = '1' unconditionally) — there is simply nothing to emit → a one-cycle <tspan font-weight="700">output bubble</tspan>.</text>
  <text x="24" y="502" font-size="11" fill="#0f172a">• The carry <tspan font-weight="700">grows</tspan> here (2 → 7). A full input beat would leave it unchanged (count + 16 − 16 = count) — only partial beats move it.</text>
  <text x="24" y="520" font-size="11" fill="#0f172a">• The next (full) crypto beat joins these 7 B: total = 7 + 16 = 23 ≥ 16 → EMIT a full beat, new carry = 7 B.</text>
</svg>
