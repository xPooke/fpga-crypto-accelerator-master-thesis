<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="520" fill="#ffffff"/>
  <text x="24" y="30" font-size="19" font-weight="700" fill="#0f172a">EMIT — the barrel shifter</text>
  <text x="24" y="50" font-size="12" fill="#64748b">w_merged = r_gearbox  OR  ( mask_bytes(input) &lt;&lt; r_gb_count·8 )     ·     example: r_gb_count = 2, full input beat, bus = 16 B</text>

  <!-- lane index ruler -->
  <text x="150" y="86" font-size="10" text-anchor="end" fill="#64748b">lane:</text>
  <text x="169" y="86" font-size="9" text-anchor="middle" fill="#64748b">0</text>
  <text x="197" y="86" font-size="9" text-anchor="middle" fill="#64748b">1</text>
  <text x="225" y="86" font-size="9" text-anchor="middle" fill="#64748b">2</text>
  <text x="253" y="86" font-size="9" text-anchor="middle" fill="#64748b">3</text>
  <text x="281" y="86" font-size="9" text-anchor="middle" fill="#64748b">4</text>
  <text x="533" y="86" font-size="9" text-anchor="middle" fill="#64748b">13</text>
  <text x="561" y="86" font-size="9" text-anchor="middle" fill="#64748b">14</text>
  <text x="589" y="86" font-size="9" text-anchor="middle" fill="#64748b">15</text>
  <text x="617" y="86" font-size="9" text-anchor="middle" fill="#64748b">16</text>
  <text x="645" y="86" font-size="9" text-anchor="middle" fill="#64748b">17</text>
  <text x="762" y="86" font-size="9" text-anchor="end" fill="#64748b">LSB → MSB</text>

  <!-- ===== Row A: input (masked) ===== -->
  <text x="150" y="120" font-size="12" font-weight="700" text-anchor="end" fill="#0f172a">INPUT</text>
  <text x="150" y="134" font-size="9" text-anchor="end" fill="#64748b">(masked)</text>
  <g font-size="9" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="155" y="104" width="28" height="30" rx="2" fill="#3b82f6"/><text x="169" y="123">I0</text>
    <rect x="183" y="104" width="28" height="30" rx="2" fill="#3b82f6"/><text x="197" y="123">I1</text>
    <rect x="211" y="104" width="28" height="30" rx="2" fill="#3b82f6"/><text x="225" y="123">I2</text>
    <rect x="239" y="104" width="28" height="30" rx="2" fill="#3b82f6"/><text x="253" y="123">I3</text>
    <rect x="267" y="104" width="28" height="30" rx="2" fill="#3b82f6"/><text x="281" y="123">I4</text>
    <rect x="295" y="104" width="224" height="30" rx="2" fill="#3b82f6" opacity="0.55"/><text x="407" y="123" font-size="10">I5 . . . I12</text>
    <rect x="519" y="104" width="28" height="30" rx="2" fill="#3b82f6"/><text x="533" y="123">I13</text>
    <rect x="547" y="104" width="28" height="30" rx="2" fill="#3b82f6"/><text x="561" y="123">I14</text>
    <rect x="575" y="104" width="28" height="30" rx="2" fill="#3b82f6"/><text x="589" y="123">I15</text>
  </g>

  <!-- shift annotation -->
  <path d="M169,140 C169,158 225,152 225,168" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr)"/>
  <path d="M589,140 C589,158 645,152 645,168" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="407" y="158" font-size="11" font-weight="700" text-anchor="middle" fill="#0ea5e9">« shift_left by r_gb_count = 2 bytes  (this is the barrel shift) »</text>

  <!-- ===== Row B: input shifted up by 2 ===== -->
  <text x="150" y="190" font-size="12" font-weight="700" text-anchor="end" fill="#0f172a">INPUT « 2</text>
  <g font-size="9" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="155" y="174" width="28" height="30" rx="2" fill="#e2e8f0" stroke="#cbd5e1"/><text x="169" y="193" fill="#94a3b8">0</text>
    <rect x="183" y="174" width="28" height="30" rx="2" fill="#e2e8f0" stroke="#cbd5e1"/><text x="197" y="193" fill="#94a3b8">0</text>
    <rect x="211" y="174" width="28" height="30" rx="2" fill="#3b82f6"/><text x="225" y="193">I0</text>
    <rect x="239" y="174" width="28" height="30" rx="2" fill="#3b82f6"/><text x="253" y="193">I1</text>
    <rect x="267" y="174" width="28" height="30" rx="2" fill="#3b82f6"/><text x="281" y="193">I2</text>
    <rect x="295" y="174" width="224" height="30" rx="2" fill="#3b82f6" opacity="0.55"/><text x="407" y="193" font-size="10">I3 . . . I10</text>
    <rect x="519" y="174" width="28" height="30" rx="2" fill="#3b82f6"/><text x="533" y="193">I11</text>
    <rect x="547" y="174" width="28" height="30" rx="2" fill="#3b82f6"/><text x="561" y="193">I12</text>
    <rect x="575" y="174" width="28" height="30" rx="2" fill="#3b82f6"/><text x="589" y="193">I13</text>
    <rect x="603" y="174" width="28" height="30" rx="2" fill="#3b82f6"/><text x="617" y="193">I14</text>
    <rect x="631" y="174" width="28" height="30" rx="2" fill="#3b82f6"/><text x="645" y="193">I15</text>
  </g>

  <!-- ===== Row C: carry ===== -->
  <text x="150" y="260" font-size="12" font-weight="700" text-anchor="end" fill="#0f172a">CARRY</text>
  <text x="150" y="274" font-size="9" text-anchor="end" fill="#64748b">r_gearbox</text>
  <g font-size="9" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="155" y="244" width="28" height="30" rx="2" fill="#8b5cf6"/><text x="169" y="263">C0</text>
    <rect x="183" y="244" width="28" height="30" rx="2" fill="#8b5cf6"/><text x="197" y="263">C1</text>
    <rect x="211" y="244" width="448" height="30" rx="2" fill="#e2e8f0" stroke="#cbd5e1"/><text x="435" y="263" fill="#94a3b8" font-size="10">0  (the high bytes are always clean, so OR is enough — no mux needed)</text>
  </g>

  <text x="407" y="302" font-size="15" font-weight="700" text-anchor="middle" fill="#64748b">OR  ↓</text>

  <!-- ===== Row D: merged ===== -->
  <text x="150" y="340" font-size="12" font-weight="700" text-anchor="end" fill="#0f172a">w_merged</text>
  <g font-size="9" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="155" y="324" width="28" height="30" rx="2" fill="#8b5cf6"/><text x="169" y="343">C0</text>
    <rect x="183" y="324" width="28" height="30" rx="2" fill="#8b5cf6"/><text x="197" y="343">C1</text>
    <rect x="211" y="324" width="28" height="30" rx="2" fill="#3b82f6"/><text x="225" y="343">I0</text>
    <rect x="239" y="324" width="28" height="30" rx="2" fill="#3b82f6"/><text x="253" y="343">I1</text>
    <rect x="267" y="324" width="28" height="30" rx="2" fill="#3b82f6"/><text x="281" y="343">I2</text>
    <rect x="295" y="324" width="224" height="30" rx="2" fill="#3b82f6" opacity="0.55"/><text x="407" y="343" font-size="10">I3 . . . I10</text>
    <rect x="519" y="324" width="28" height="30" rx="2" fill="#3b82f6"/><text x="533" y="343">I11</text>
    <rect x="547" y="324" width="28" height="30" rx="2" fill="#3b82f6"/><text x="561" y="343">I12</text>
    <rect x="575" y="324" width="28" height="30" rx="2" fill="#3b82f6"/><text x="589" y="343">I13</text>
    <rect x="603" y="324" width="28" height="30" rx="2" fill="#f59e0b"/><text x="617" y="343">I14</text>
    <rect x="631" y="324" width="28" height="30" rx="2" fill="#f59e0b"/><text x="645" y="343">I15</text>
  </g>

  <!-- bus boundary between lane 15 and 16 -->
  <line x1="603" y1="100" x2="603" y2="366" stroke="#94a3b8" stroke-dasharray="4 3"/>

  <!-- split brackets -->
  <path d="M155,372 L155,382 L603,382 L603,372" fill="none" stroke="#10b981" stroke-width="1.6"/>
  <text x="379" y="400" font-size="11" font-weight="700" text-anchor="middle" fill="#10b981">output beat = w_merged[low 16 B] → m_axis_tdata</text>

  <path d="M603,372 L603,382 L659,382 L659,372" fill="none" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="631" y="416" font-size="10" font-weight="700" text-anchor="middle" fill="#d97706">new carry</text>
  <text x="631" y="428" font-size="9" text-anchor="middle" fill="#d97706">r_gb_count = 2</text>

  <!-- notes -->
  <text x="24" y="466" font-size="12" font-weight="700" fill="#0f172a">Key points</text>
  <text x="24" y="486" font-size="11" fill="#0f172a">• The carry (older bytes) sits at the LSB; the input is shifted <tspan font-weight="700">up by r_gb_count</tspan> so it lands right on top of it — byte order is preserved.</text>
  <text x="24" y="504" font-size="11" fill="#0f172a">• Low 16 B = the output beat, the spill above = the <tspan font-weight="700">new carry</tspan>. total = 2 + 16 = 18 ≥ 16 → EMIT, new count = 18 − 16 = 2.</text>
</svg>
